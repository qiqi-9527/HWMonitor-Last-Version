name: Twitter Auto-Post Workflow

# 触发条件：每6小时自动运行 + 支持手动触发
on:
  schedule:
    - cron: '0 */8 * * *'  # 每8小时运行（0点、8点、16点）
  workflow_dispatch:        # 手动触发入口

jobs:
  post-and-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      # 步骤1：检出代码（必须 fetch-depth: 0 才能提交）
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 必须为0，否则无法 push
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      # 步骤2：拉取最新代码（防止冲突）
      - name: Pull latest changes from main branch
        run: |
          # 暂存可能的本地修改
          git stash
          git pull origin main --rebase
          # 恢复暂存（如果有）
          git stash pop || true
          echo "✅ 已同步远程最新代码"

      # 步骤3：检查图片目录是否存在有效图片（✅ 修复版）
      - name: Validate image directory and files
        run: |
          mkdir -p image

          # ✅ 方法1：使用 find + 正确正则
          image_count=$(find image -type f -iregex '.*\.$jpg\|jpeg\|png\|gif$' | wc -l)

          # ✅ 或者方法2：使用 glob 扩展（推荐，简单可靠）
          # image_count=$(echo image/*.{jpg,jpeg,png,gif} | tr ' ' '\n' | grep -v 'image/\*' | wc -l)

          if [ $image_count -eq 0 ]; then
            echo "Error: 未在 image 目录找到任何有效图片"
            exit 1
          fi
          echo "✅ 检测到 $image_count 张有效图片，继续执行"

      # 步骤4：配置 Python 环境
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      # 步骤5：安装依赖
      - name: Install required dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          else
            pip install tweepy
          fi
          echo "✅ 依赖安装完成"

      # 步骤6：执行推文脚本，并处理图片删除 + 索引更新
      - name: Run tweet script and clean up published image
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_SECRET_KEY: ${{ secrets.API_SECRET_KEY }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
          BEARER_TOKEN: ${{ secrets.BEARER_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          echo "📝 开始执行推文发布脚本..."
          SCRIPT_OUTPUT=$(python tweet_diario.py)
          echo "$SCRIPT_OUTPUT"
          
          # 提取已发布的图片路径
          PUBLISHED_IMAGE=$(echo "$SCRIPT_OUTPUT" | grep "PUBLISHED_IMAGE:" | awk -F': ' '{print $2}')
          
          if [ -z "$PUBLISHED_IMAGE" ] || [ ! -f "$PUBLISHED_IMAGE" ]; then
            echo "Error: 未找到有效的已发布图片路径"
            exit 1
          fi
          
          echo "🗑️  准备删除已发布的图片：$PUBLISHED_IMAGE"
          
          # 配置 Git 身份
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          # 从 Git 中删除图片文件
          git rm "$PUBLISHED_IMAGE"
          echo "✅ 已从 Git 跟踪中移除图片：$(basename "$PUBLISHED_IMAGE")"
          
          # 添加 last_index.txt（关键：记录发布进度）
          if [ -f "last_index.txt" ]; then
            git add last_index.txt
            echo "✅ 已添加 last_index.txt 到提交"
          else
            echo "⚠️  last_index.txt 不存在，将创建默认文件"
            echo "0" > last_index.txt
            git add last_index.txt
          fi
          
          # 检查是否有待提交的更改
          if git diff --cached --quiet; then
            echo "ℹ️  没有需要提交的更改（可能无新发布）"
          else
            # 提交更改
            git commit -m "🚀 Auto: Publish tweet and delete image $(basename "$PUBLISHED_IMAGE")"
            # 推送到远程
            git push origin main
            echo "✅ 已成功推送图片删除和索引更新到远程仓库"
          fi

      # 步骤7：失败处理
      - name: Handle workflow failures
        if: failure()
        run: |
          echo "❌ 工作流执行失败，请检查以下可能原因："
          echo "1. Twitter API 密钥无效或权限不足"
          echo "2. PERSONAL_ACCESS_TOKEN 无仓库推送权限（需 repo 权限）"
          echo "3. image/ 目录无有效图片或路径错误"
          echo "4. API 速率限制等待时间超过 20 分钟"
          echo "5. 网络问题或 Twitter API 临时故障"
          echo "6. Git 冲突导致 pull/push 失败"
          echo "7. last_index.txt 或 tweets.txt 文件权限问题"
